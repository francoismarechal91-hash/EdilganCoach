# EdilganSuperCoach : envoie les rappels (boire, médicaments, repas…) en notification,
# même téléphone en veille. Gratuit : tourne sur GitHub Actions toutes les 10 minutes.
# Le secret EDG_PUSH (créé une seule fois depuis l'app) permet de signer et de déchiffrer.
name: Rappels
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read
concurrency:
  group: rappels
  cancel-in-progress: false
jobs:
  rappels:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'Rappels EdilganSuperCoach')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - run: node push/server.mjs
        env:
          EDG_PUSH: ${{ secrets.EDG_PUSH }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
